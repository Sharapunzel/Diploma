services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  kafka:
    environment:
      DIPLOMA_KAFKA_MODE: production
      KAFKA_BIND_ADDRESS: ${KAFKA_BIND_ADDRESS:-0.0.0.0}
      KAFKA_PUBLIC_HOST: ${KAFKA_PUBLIC_HOST:?Set public DNS name matching the Kafka certificate}
      KAFKA_HOST_PORT: ${KAFKA_HOST_PORT:-9094}
      KAFKA_BROKER_PEM_FILE: /run/secrets/kafka_broker_pem
      KAFKA_CA_FILE: /run/secrets/kafka_ca
    ports: ["${KAFKA_BIND_ADDRESS:-0.0.0.0}:${KAFKA_HOST_PORT:-9094}:${KAFKA_EXTERNAL_PORT:-9094}"]
    secrets: [kafka_admin_password, kafka_reader_password, kafka_broker_pem, kafka_ca]
  kafka-acls:
    environment:
      DIPLOMA_KAFKA_MODE: production
      KAFKA_CA_FILE: /run/secrets/kafka_ca
    secrets: [kafka_admin_password, kafka_ca]
  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
  api:
    environment:
      ENVIRONMENT: production
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_AGENT_PUBLIC_HOST: ${KAFKA_PUBLIC_HOST:?Set public DNS name matching the Kafka certificate}
      KAFKA_AGENT_PUBLIC_PORT: ${KAFKA_HOST_PORT:-9094}
      KAFKA_CA_FILE: /run/secrets/kafka_ca
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      OIDC_STATE_SECRET_FILE: /run/secrets/oidc_state_secret
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      EXTERNAL_SECRET_KEY_FILE: /run/secrets/external_secret_key
      AGENT_CREDENTIALS_KEY_FILE: /run/secrets/agent_credentials_key
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email}
      OIDC_SUCCESS_REDIRECT_URL: ${OIDC_SUCCESS_REDIRECT_URL:-/}
      OIDC_ERROR_REDIRECT_URL: ${OIDC_ERROR_REDIRECT_URL:-/login?error=oidc}
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_HOSTS: ${PUBLIC_HOST:?Set public web DNS name},localhost
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.0.10}
    secrets: [database_url, oidc_state_secret, oidc_client_secret, external_secret_key, kafka_reader_password, kafka_ca, agent_credentials_key]
  provisioner:
    environment:
      ENVIRONMENT: production
      PROCESS_ROLE: provisioner
      KAFKA_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_RUNTIME_USERNAME: diploma-reader
      KAFKA_RUNTIME_PASSWORD_FILE: /run/secrets/kafka_reader_password
      KAFKA_ADMIN_USERNAME: diploma-kafka-admin
      KAFKA_ADMIN_PASSWORD_FILE: /run/secrets/kafka_admin_password
      KAFKA_CA_FILE: /run/secrets/kafka_ca
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      AGENT_CREDENTIALS_KEY_FILE: /run/secrets/agent_credentials_key
      OIDC_STATE_SECRET_FILE: /run/secrets/oidc_state_secret
      EXTERNAL_SECRET_KEY_FILE: /run/secrets/external_secret_key
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_HOSTS: ${PUBLIC_HOST:?Set public web DNS name},localhost
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.0.10}
    secrets: [database_url, kafka_reader_password, kafka_admin_password, kafka_ca, agent_credentials_key, oidc_state_secret, external_secret_key]
  proxy:
    ports:
      - "${HTTP_BIND:-0.0.0.0:80:80}"
      - "${HTTPS_BIND:-0.0.0.0:443:443}"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [web_certificate, web_private_key]

secrets:
  kafka_admin_password:
    file: ${KAFKA_ADMIN_PASSWORD_FILE:?Set path to protected Kafka admin password file}
  kafka_reader_password:
    file: ${KAFKA_READER_PASSWORD_FILE:?Set path to protected Kafka reader password file}
  kafka_broker_pem:
    file: ${KAFKA_BROKER_PEM_FILE:?Set path to protected Kafka broker PEM file}
  kafka_ca:
    file: ${KAFKA_CA_FILE:?Set path to trusted Kafka CA PEM file}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set path to protected PostgreSQL password file}
  database_url:
    file: ${DATABASE_URL_FILE:?Set path to protected SQLAlchemy database URL file}
  oidc_state_secret:
    file: ${OIDC_STATE_SECRET_FILE:?Set path to protected unique OIDC state secret}
  oidc_client_secret:
    file: ${OIDC_CLIENT_SECRET_FILE:?Set path to protected OIDC client secret}
  external_secret_key:
    file: ${EXTERNAL_SECRET_KEY_FILE:?Set path to protected Fernet key}
  agent_credentials_key:
    file: ${AGENT_CREDENTIALS_KEY_FILE:?Set path to protected agent credential encryption key}
  web_certificate:
    file: ${WEB_CERTIFICATE_FILE:?Set path to public web certificate chain}
  web_private_key:
    file: ${WEB_PRIVATE_KEY_FILE:?Set path to protected web private key}
