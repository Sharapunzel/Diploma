services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL_TLS://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL_TLS://${KAFKA_PUBLIC_HOST:?Set public DNS name matching the Kafka certificate}:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL_TLS:SSL
      KAFKA_SSL_KEYSTORE_LOCATION: /run/certs/kafka-broker.pem
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_CLIENT_AUTH: none
    ports: ["${KAFKA_BIND_ADDRESS:-0.0.0.0}:${KAFKA_HOST_PORT:-9094}:9094"]
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ${KAFKA_BROKER_PEM_FILE:?Set protected combined Kafka cert/key PEM file}:/run/certs/kafka-broker.pem:ro
  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
  api:
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      OIDC_STATE_SECRET_FILE: /run/secrets/oidc_state_secret
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      EXTERNAL_SECRET_KEY_FILE: /run/secrets/external_secret_key
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email}
      OIDC_SUCCESS_REDIRECT_URL: ${OIDC_SUCCESS_REDIRECT_URL:-/}
      OIDC_ERROR_REDIRECT_URL: ${OIDC_ERROR_REDIRECT_URL:-/login?error=oidc}
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_HOSTS: ${PUBLIC_HOST:?Set public web DNS name},localhost
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.0.10}
    secrets: [database_url, oidc_state_secret, oidc_client_secret, external_secret_key]
  proxy:
    ports:
      - "${HTTP_BIND:-0.0.0.0:80:80}"
      - "${HTTPS_BIND:-0.0.0.0:443:443}"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [web_certificate, web_private_key]

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set path to protected PostgreSQL password file}
  database_url:
    file: ${DATABASE_URL_FILE:?Set path to protected SQLAlchemy database URL file}
  oidc_state_secret:
    file: ${OIDC_STATE_SECRET_FILE:?Set path to protected unique OIDC state secret}
  oidc_client_secret:
    file: ${OIDC_CLIENT_SECRET_FILE:?Set path to protected OIDC client secret}
  external_secret_key:
    file: ${EXTERNAL_SECRET_KEY_FILE:?Set path to protected Fernet key}
  web_certificate:
    file: ${WEB_CERTIFICATE_FILE:?Set path to public web certificate chain}
  web_private_key:
    file: ${WEB_PRIVATE_KEY_FILE:?Set path to protected web private key}
