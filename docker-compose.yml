name: diploma

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diploma_user}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-diploma_db}
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  kafka:
    build: ./kafka
    restart: unless-stopped
    hostname: kafka
    environment:
      DIPLOMA_KAFKA_MODE: development
      KAFKA_BIND_ADDRESS: ${KAFKA_BIND_ADDRESS:-127.0.0.1}
      KAFKA_PUBLIC_HOST: ${KAFKA_PUBLIC_HOST:-127.0.0.1}
      KAFKA_HOST_PORT: ${KAFKA_HOST_PORT:-9092}
      KAFKA_ADMIN_PASSWORD_FILE: /run/secrets/kafka_admin_password
      KAFKA_READER_PASSWORD_FILE: /run/secrets/kafka_reader_password
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    secrets: [kafka_admin_password, kafka_reader_password]
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /tmp/diploma-kafka-admin.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [internal]

  kafka-acls:
    build: ./kafka
    command: ["acls"]
    restart: "no"
    environment:
      DIPLOMA_KAFKA_MODE: development
      KAFKA_ADMIN_PASSWORD_FILE: /run/secrets/kafka_admin_password
    secrets: [kafka_admin_password]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [internal]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diploma_user}:diploma_password@postgres:5432/${POSTGRES_DB:-diploma_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diploma_user}:diploma_password@postgres:5432/${POSTGRES_DB:-diploma_db}
      KAFKA_CONSUMERS_ENABLED: "true"
      KAFKA_METADATA_TIMEOUT_SECONDS: "5"
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_RUNTIME_USERNAME: diploma-reader
      KAFKA_RUNTIME_PASSWORD_FILE: /run/secrets/kafka_reader_password
      KAFKA_DEV_ALLOWED_BOOTSTRAP_SERVERS: "127.0.0.1:${KAFKA_HOST_PORT:-9092},localhost:${KAFKA_HOST_PORT:-9092},[::1]:${KAFKA_HOST_PORT:-9092},kafka:9092"
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-acls:
        condition: service_completed_successfully
    secrets: [kafka_reader_password]
    networks: [internal]

  proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on: [api]
    networks:
      internal:
        ipv4_address: ${PROXY_IP:-172.30.0.10}

volumes:
  postgres_data:
  kafka_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.0.0/24}

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./.dev/postgres_password.example}
  kafka_admin_password:
    file: ${KAFKA_ADMIN_PASSWORD_FILE:-./.dev/kafka_admin_password}
  kafka_reader_password:
    file: ${KAFKA_READER_PASSWORD_FILE:-./.dev/kafka_reader_password}
