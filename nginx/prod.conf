server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /run/secrets/web_certificate;
    ssl_certificate_key /run/secrets/web_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    location = /api { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(?:map|json|html)$ { return 404; }

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /pictures/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~ ^/(?:login|agents(?:/[^/]+)?|events|administration|connections|sources|normalizers(?:/[^/]+(?:/edit)?)?|diagnostics|settings)/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location / { return 404; }
}
