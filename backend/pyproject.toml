[project]
name = "diploma-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "authlib>=1.3,<2",
  "email-validator>=2.2,<3",
  "confluent-kafka>=2.6,<3",
  "alembic>=1.13,<2",
  "anyio>=4.10,<4.15",
  "fastapi>=0.115,<1",
  "httpx2>=2.9,<3",
  "itsdangerous>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=40.8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources.ecs" = ["*.yml", "*.txt", "*.json"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/0001_database_foundation.py" = ["I001"]
