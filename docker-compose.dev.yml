services:
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: null
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diploma_password}
    secrets: []
    ports: ["${POSTGRES_BIND:-127.0.0.1:5432:5432}"]
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_PUBLIC_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
    ports: ["${KAFKA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}:9094"]
  migrate:
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diploma_user}:${POSTGRES_PASSWORD:-diploma_password}@postgres:5432/${POSTGRES_DB:-diploma_db}
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diploma_user}:${POSTGRES_PASSWORD:-diploma_password}@postgres:5432/${POSTGRES_DB:-diploma_db}
      ENVIRONMENT: development
      LOCAL_AUTH_ENABLED: "true"
      EXTERNAL_SECRET_KEY: ${EXTERNAL_SECRET_KEY:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:-development-only-change-me-please-32-bytes}
      OIDC_SUCCESS_REDIRECT_URL: ${OIDC_SUCCESS_REDIRECT_URL:-/}
      OIDC_ERROR_REDIRECT_URL: ${OIDC_ERROR_REDIRECT_URL:-/login?error=oidc}
      SESSION_COOKIE_SECURE: "false"
    expose: ["8000"]
  proxy:
    ports: ["${PROXY_BIND:-127.0.0.1:8080:8080}"]
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
